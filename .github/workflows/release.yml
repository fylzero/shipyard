name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The release body comes from src/changelog.ts (the in-app Changelog) through
# scripts/release-notes.ts, which also adds the download instructions. The body
# covers every changelog version since the last published release. A version
# without a changelog entry fails at the Release notes step, before building.

jobs:
  macos:
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Require Apple release credentials
        shell: bash
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/macos-releases.md."
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then exit 1; fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application: "* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes cover every version since the last published release, so a
          # version that was bumped but never tagged still gets its notes.
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            echo "RELEASE_NOTES<<__RELEASE_NOTES__"
            bun scripts/release-notes.ts ${since:+--since "$since"}
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # This wrapper verifies packaged apps before the action uploads anything.
          tauriScript: bash scripts/build-macos-release.sh
          tagName: v__VERSION__
          releaseName: Shipyard v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: "--target aarch64-apple-darwin"
          releaseAssetNamePattern: "Shipyard-macos-arm64[ext]"

  linux:
    # Runs after macOS and one architecture at a time, so each upload merges into
    # the release's latest.json instead of racing another job and dropping its entries.
    needs: macos
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: apt-${{ runner.arch }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: apt-${{ runner.arch }}-

      - name: Install Linux build dependencies
        timeout-minutes: 18
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-cache/partial
          apt="apt-get -o Dir::Cache::Archives=$HOME/apt-cache -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for attempt in 1 2 3; do
            if sudo timeout 300 sh -c "$apt update && $apt install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf"; then
              sudo chown -R "$USER" ~/apt-cache
              exit 0
            fi
            echo "::warning::apt-get attempt $attempt failed or stalled, retrying on archive.ubuntu.com"
            sudo sed -i 's#http://azure.archive.ubuntu.com/#http://archive.ubuntu.com/#' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes cover every version since the last published release, so a
          # version that was bumped but never tagged still gets its notes.
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            echo "RELEASE_NOTES<<__RELEASE_NOTES__"
            bun scripts/release-notes.ts ${since:+--since "$since"}
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: Shipyard v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          releaseAssetNamePattern: "Shipyard-linux-${{ matrix.arch }}[ext]"

  windows:
    # Runs after Linux and one architecture at a time for the same latest.json reason.
    # ARM64 is cross-compiled on the x64 runner, which has the MSVC ARM64 build tools.
    needs: linux
    # Azure trusts this job's GitHub sign-in only from the `release` environment.
    # See docs/windows-releases.md.
    environment: release
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Code signing runs only once AZURE_SIGNING_PROFILE is set, which needs an
      # approved identity validation. Until then the installers stay unsigned.
      - name: Setup .NET for code signing
        if: vars.AZURE_SIGNING_PROFILE != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Sign in to Azure for code signing
        if: vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Set up code signing
        if: vars.AZURE_SIGNING_PROFILE != ''
        shell: pwsh
        run: >-
          ./scripts/setup-windows-signing.ps1
          -Endpoint "${{ vars.AZURE_SIGNING_ENDPOINT }}"
          -Account "${{ vars.AZURE_SIGNING_ACCOUNT }}"
          -CertificateProfile "${{ vars.AZURE_SIGNING_PROFILE }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes cover every version since the last published release, so a
          # version that was bumped but never tagged still gets its notes.
          since=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            echo "RELEASE_NOTES<<__RELEASE_NOTES__"
            bun scripts/release-notes.ts ${since:+--since "$since"}
            echo "__RELEASE_NOTES__"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The package.json script sets PATH the Unix way, which would break PATH on Windows.
          tauriScript: bunx tauri
          tagName: v__VERSION__
          releaseName: Shipyard v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # TAURI_SIGNING_ARGS comes from "Set up code signing", and is empty without it.
          args: "--target ${{ matrix.target }} --bundles nsis ${{ env.TAURI_SIGNING_ARGS }}"
          releaseAssetNamePattern: "Shipyard-windows-${{ matrix.arch }}[ext]"
